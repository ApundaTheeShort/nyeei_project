<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – NYEEI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/admin.js" defer></script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-main); padding: 1.5rem;">

  <!-- LOGIN SCREEN (Visible by default) -->
  <div id="admin-login-screen" style="background:var(--bg-card); border:1px solid var(--border-light); border-radius:var(--radius-xl); padding:3rem 2.5rem; width:100%; max-width:420px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; align-items:center; text-align:center; margin: auto;">
    <div style="width:64px; height:64px; border-radius:50%; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; margin-bottom:1.5rem; color:var(--primary); font-size:1.6rem;">
      🔒
    </div>
    <h2 style="font-family:var(--font-heading); font-size:1.5rem; font-weight:800; margin-bottom:0.3rem; color:var(--dark);">Admin Portal</h2>
    <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1.75rem;">NYEEI Management Dashboard — Authorized Personnel Only.</p>
    
    <input id="admin-pw" type="password" placeholder="Enter admin password" class="form-input" style="text-align:center; letter-spacing:0.1em; margin-bottom:1rem;" />
    
    <div id="admin-login-error" style="display:none; background:#FDECEA; border:1px solid #F5C6C2; border-radius:var(--radius-md); padding:0.65rem 1rem; font-size:0.85rem; color:#C0392B; margin-bottom:1rem; width:100%;"></div>
    
    <button onclick="adminLogin()" class="form-submit-btn" style="margin-bottom:1.25rem;">Unlock Dashboard →</button>
    <a href="index.html" style="text-decoration: none; color:var(--text-muted); font-size:0.9rem; font-weight:600; transition: var(--transition);">← Back to Website</a>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="admin-main" style="display:none; background:var(--bg-card); border-radius:var(--radius-xl); width:100%; max-width:1080px; max-height:90vh; overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid var(--border-light); margin: auto;">
    <!-- Header -->
    <div style="background:var(--primary); padding:1.25rem 2rem; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:0.85rem;">
        <div style="width:40px; height:40px; border-radius:var(--radius-sm); background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; color:#FFF; font-size:1.2rem;">
          📊
        </div>
        <div style="text-align: left;">
          <div style="font-family:var(--font-heading); font-weight:800; font-size:1.15rem; color:#FFF;">NYEEI Management Portal</div>
          <div style="font-size:0.78rem; color:rgba(255,255,255,0.7);">Logged in as: John Ochieng Ohuru (Founder &amp; CEO)</div>
        </div>
      </div>
      <div style="display:flex; gap:0.6rem;">
        <button onclick="loadAdminTab('overview')" class="btn-ghost" style="padding:0.45rem 1rem; font-size:0.82rem; border-radius:var(--radius-sm);">🔄 Refresh</button>
        <button onclick="adminLogout()" class="btn-ghost" style="padding:0.45rem 1rem; font-size:0.82rem; border-radius:var(--radius-sm);">🔒 Logout</button>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex; border-bottom:1px solid var(--border-light); background:var(--bg-main); flex-shrink:0; overflow-x:auto;">
      <button class="admin-tab-btn" id="tab-overview" data-tab="overview" onclick="loadAdminTab('overview')" style="padding:1rem 1.5rem; border:none; background:none; font-family:inherit; font-size:0.92rem; font-weight:700; cursor:pointer; color:var(--text-muted); white-space:nowrap; border-bottom:3px solid transparent; margin-bottom:-1px; transition:var(--transition);">📊 Overview</button>
      <button class="admin-tab-btn" id="tab-registrations" data-tab="registrations" onclick="loadAdminTab('registrations')" style="padding:1rem 1.5rem; border:none; background:none; font-family:inherit; font-size:0.92rem; font-weight:700; cursor:pointer; color:var(--text-muted); white-space:nowrap; border-bottom:3px solid transparent; margin-bottom:-1px; transition:var(--transition);">👥 Registrations</button>
      <button class="admin-tab-btn" id="tab-donations" data-tab="donations" onclick="loadAdminTab('donations')" style="padding:1rem 1.5rem; border:none; background:none; font-family:inherit; font-size:0.92rem; font-weight:700; cursor:pointer; color:var(--text-muted); white-space:nowrap; border-bottom:3px solid transparent; margin-bottom:-1px; transition:var(--transition);">💰 Donations</button>
      <button class="admin-tab-btn" id="tab-messages" data-tab="messages" onclick="loadAdminTab('messages')" style="padding:1rem 1.5rem; border:none; background:none; font-family:inherit; font-size:0.92rem; font-weight:700; cursor:pointer; color:var(--text-muted); white-space:nowrap; border-bottom:3px solid transparent; margin-bottom:-1px; transition:var(--transition);">📩 Messages</button>
    </div>

    <!-- Content -->
    <div id="admin-content" style="padding:2rem; overflow-y:auto; flex:1; text-align: left;"></div>
  </div>

</body>
</html>
