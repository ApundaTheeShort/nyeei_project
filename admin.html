<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – NYEEI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/admin.js" defer></script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f1; padding: 1rem;">

  <!-- LOGIN SCREEN (Visible by default) -->
  <div id="admin-login-screen" style="background:white;border-radius:16px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,0.1);display:flex;flex-direction:column;align-items:center;text-align:center; margin: auto;">
    <div style="width:60px;height:60px;border-radius:50%;background:#0f5228;display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>
    <h2 style="font-family:Syne,sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:0.25rem;color: var(--green-dark);">Admin Access</h2>
    <p style="font-size:0.88rem;color:#4a6355;margin-bottom:1.5rem;">NYEEI Management Dashboard — authorised personnel only.</p>
    <input id="admin-pw" type="password" placeholder="Enter admin password" style="width:100%;border:1.5px solid #d4e0d8;border-radius:8px;padding:0.75rem 1rem;font-size:0.95rem;font-family:inherit;outline:none;margin-bottom:0.85rem;text-align:center;letter-spacing:0.1em;" />
    <div id="admin-login-error" style="display:none;background:#fdecea;border:1px solid #f5c6c2;border-radius:6px;padding:0.6rem 1rem;font-size:0.85rem;color:#c0392b;margin-bottom:0.85rem;width:100%;"></div>
    <button onclick="adminLogin()" style="width:100%;background:#0f5228;color:white;border:none;border-radius:8px;padding:0.85rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:1rem; transition: background 0.2s;">Unlock Dashboard</button>
    <a href="index.html" style="text-decoration: none; color:#4a6355; font-size:0.88rem; font-family:inherit; transition: color 0.2s;" onmouseover="this.style.color='var(--green)'" onmouseout="this.style.color='#4a6355'">← Back to Website</a>
  </div>

  <!-- MAIN DASHBOARD (Hidden by default, styled dynamically via style.css/admin.js) -->
  <div id="admin-main" style="display:none;background:white;border-radius:16px;width:100%;max-width:1000px;max-height:90vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15); margin: auto;">
    <!-- Header -->
    <div style="background:#0f5228;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <div style="width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <div style="text-align: left;">
          <div style="font-family:Syne,sans-serif;font-weight:800;font-size:1rem;color:white;">NYEEI Admin Dashboard</div>
          <div style="font-size:0.75rem;color:rgba(255,255,255,0.6);">Logged in as: John Ochieng Ohuru</div>
        </div>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <button onclick="loadAdminTab('overview')" style="background:rgba(255,255,255,0.15);color:white;border:none;border-radius:6px;padding:0.4rem 0.85rem;font-size:0.82rem;font-weight:600;cursor:pointer;">🔄 Refresh</button>
        <button onclick="adminLogout()" style="background:rgba(255,255,255,0.15);color:white;border:none;border-radius:6px;padding:0.4rem 0.85rem;font-size:0.82rem;font-weight:600;cursor:pointer;">🔒 Logout</button>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;border-bottom:2px solid #eef3f0;background:#fafafa;flex-shrink:0;overflow-x:auto;">
      <button class="admin-tab-btn" id="tab-overview" data-tab="overview" onclick="loadAdminTab('overview')" style="padding:0.85rem 1.25rem;border:none;background:none;font-family:inherit;font-size:0.88rem;font-weight:600;cursor:pointer;color:#4a6355;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;">📊 Overview</button>
      <button class="admin-tab-btn" id="tab-registrations" data-tab="registrations" onclick="loadAdminTab('registrations')" style="padding:0.85rem 1.25rem;border:none;background:none;font-family:inherit;font-size:0.88rem;font-weight:600;cursor:pointer;color:#4a6355;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;">👥 Registrations</button>
      <button class="admin-tab-btn" id="tab-donations" data-tab="donations" onclick="loadAdminTab('donations')" style="padding:0.85rem 1.25rem;border:none;background:none;font-family:inherit;font-size:0.88rem;font-weight:600;cursor:pointer;color:#4a6355;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;">💰 Donations</button>
      <button class="admin-tab-btn" id="tab-messages" data-tab="messages" onclick="loadAdminTab('messages')" style="padding:0.85rem 1.25rem;border:none;background:none;font-family:inherit;font-size:0.88rem;font-weight:600;cursor:pointer;color:#4a6355;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;">📩 Messages</button>
    </div>

    <!-- Content -->
    <div id="admin-content" style="padding:1.5rem;overflow-y:auto;flex:1; text-align: left;"></div>
  </div>

</body>
</html>
